<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Task Compass · 技术与学习路线 / Route navigator</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#263122;font:16px/1.8 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:30px 24px 60px}nav{display:flex;gap:12px;justify-content:space-between;align-items:center}a{color:#985127}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #aeb8a5;background:#fffef9;color:#263122;border-radius:7px;padding:6px 13px}button[aria-pressed=true]{background:#263122;color:white}h1{font-size:clamp(32px,5vw,48px);line-height:1.3}.muted{color:#65705f}.filters{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-size:14px}input,select{display:block;width:100%;padding:11px;margin:6px 0 16px;border:1px solid #aeb8a5;border-radius:8px;background:#fffef9}article{padding:24px;background:#fffef9;border:1px solid #d9dfce;border-radius:14px;margin:18px 0}article h2{font-size:24px;margin:0 0 10px}article p{margin:9px 0}details{border-top:1px solid #dde1d6;margin-top:16px;padding-top:12px}summary{cursor:pointer;font-weight:bold}.links{display:flex;gap:15px;flex-wrap:wrap}.fine{font-size:13px;color:#65705f}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #d88a47;outline-offset:3px}@media(max-width:650px){.filters{grid-template-columns:1fr}main{padding:24px 16px}article{padding:20px}}</style></head><body><main><nav><a href="https://github.com/CodyQin/ai-task-compass">AI Task Compass · GitHub</a><span><button id="zh" aria-pressed="true">中文</button> <button id="en" aria-pressed="false">English</button></span></nav><h1 id="heading"></h1><p id="intro" class="muted"></p><p id="boundary" class="fine"></p><div class="links"><a id="guide" href="docs/technical-routes.zh-CN.md"></a><a id="learning" href="docs/learning-paths.zh-CN.md"></a><a id="delivery" href="templates/DELIVERY-CHECKLIST.md"></a><a id="start" href="index.html"></a></div><section class="filters"><label><span id="searchLabel"></span><input id="query" type="search"></label><label><span id="routeLabel"></span><select id="route"></select></label></section><p id="count" role="status"></p><section id="cards" aria-label="Routes"></section><p class="fine" id="review"></p></main><script>
const data=__ROUTES__;let lang='zh';const el=id=>document.getElementById(id);const copy={zh:{heading:'从业务问题，找到技术与学习路线',intro:'先看需要什么能力，再比较方案。每条路线给适用条件、起步方法、准备项、官方资料、练习与验收。',boundary:'这是资料筛选页，不调用 AI，也不自动诊断业务。路线是参考和学习指导，未声称本仓库已实现这些集成。数据只在浏览器处理，不上传任务。',guide:'完整技术地图',learning:'按角色学习',delivery:'交付检查表',start:'描述任务，让 AI 帮我梳理',searchLabel:'按关键词筛选，例如：RAG、反馈、权限、Harness',routeLabel:'选择一个方向',all:'全部路线',empty:'没有匹配项。试试更短的关键词，或选全部路线。',detail:'展开前提、练习与验收',review:'官方资料核查：2026-11-07。选型前复核版本、费用、地区和许可；不把文档介绍等同于实测。',labels:{problem:'业务问题',when:'适用条件',avoid:'不适用 / 先处理什么',start:'起步方案',prerequisites:'需要准备',exercise:'最小学习练习',acceptance:'怎样验收'}},en:{heading:'From a business problem to a technical route',intro:'Choose the capability before the stack. Routes include use conditions, simple starts, prerequisites, official resources, exercises and acceptance.',boundary:'A local resource filter, not an AI diagnosis. Routes are guidance, not implemented integrations. No model calls or task upload.',guide:'Full route map',learning:'Learn by role',delivery:'Delivery checklist',start:'Describe a task to your AI',searchLabel:'Filter by keyword, e.g. RAG, feedback, access, harness',routeLabel:'Choose a direction',all:'All routes',empty:'No matches. Try a shorter keyword or all routes.',detail:'Prerequisites, exercise and acceptance',review:'Official references checked 2026-11-07. Recheck versions, fees, region and licensing; documentation is not a hands-on validation.',labels:{problem:'Problem',when:'Use when',avoid:'Avoid / resolve first',start:'Simple route',prerequisites:'Prerequisites',exercise:'Small learning exercise',acceptance:'Acceptance'}}};
function paragraph(parent,key,value){const p=document.createElement('p'),b=document.createElement('strong');b.textContent=key+': ';p.append(b,document.createTextNode(value));parent.append(p);}
function render(){const t=copy[lang],q=el('query').value.trim().toLocaleLowerCase(),id=el('route').value;const matches=data.routes.filter(r=>(!id||r.id===id)&&(!q||JSON.stringify(r).toLocaleLowerCase().includes(q)));el('cards').replaceChildren();el('count').textContent=lang==='zh'?'显示 '+matches.length+' / '+data.routes.length+' 条路线':matches.length+' / '+data.routes.length+' routes';if(!matches.length){el('cards').textContent=t.empty;return;}for(const r of matches){const a=document.createElement('article'),h=document.createElement('h2');h.textContent=r.title[lang];a.append(h);for(const k of ['problem','when','start'])paragraph(a,t.labels[k],r[k][lang]);const d=document.createElement('details'),s=document.createElement('summary');s.textContent=t.detail;d.append(s);for(const k of ['avoid','prerequisites','exercise','acceptance'])paragraph(d,t.labels[k],r[k][lang]);const links=document.createElement('p');links.className='links';for(const x of r.resources){const link=document.createElement('a');link.textContent=x.title;link.href=x.url;link.rel='noopener noreferrer';links.append(link);}d.append(links);a.append(d);el('cards').append(a);}}
function setLanguage(next){const current=el('route').value;lang=next;document.documentElement.lang=lang==='zh'?'zh-CN':'en';const t=copy[lang];for(const k of ['heading','intro','boundary','guide','learning','delivery','start','searchLabel','routeLabel','review'])el(k).textContent=t[k];el('guide').href='https://github.com/CodyQin/ai-task-compass/blob/main/docs/technical-routes.'+(lang==='zh'?'zh-CN':'en')+'.md';el('learning').href='https://github.com/CodyQin/ai-task-compass/blob/main/docs/learning-paths.'+(lang==='zh'?'zh-CN':'en')+'.md';el('delivery').href='https://github.com/CodyQin/ai-task-compass/blob/main/templates/DELIVERY-CHECKLIST.md';el('start').href=lang==='zh'?'index.html':'en.html';el('route').replaceChildren();for(const [value,label] of [['',t.all],...data.routes.map(r=>[r.id,r.title[lang]])]){const o=document.createElement('option');o.value=value;o.textContent=label;el('route').append(o);}el('route').value=current;el('zh').setAttribute('aria-pressed',String(lang==='zh'));el('en').setAttribute('aria-pressed',String(lang==='en'));render();}
el('zh').onclick=()=>setLanguage('zh');el('en').onclick=()=>setLanguage('en');el('query').oninput=render;el('route').onchange=render;setLanguage('zh');
</script></body></html>
