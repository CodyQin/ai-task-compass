function paragraph(parent,key,value){const p=document.createElement('p'),b=document.createElement('strong');b.textContent=key+': ';p.append(b,document.createTextNode(value));parent.append(p);}
function render(){const t=copy[lang],q=el('query').value.trim().toLocaleLowerCase(),id=el('route').value;const matches=data.routes.filter(r=>(!id||r.id===id)&&(!q||JSON.stringify(r).toLocaleLowerCase().includes(q)));el('cards').replaceChildren();el('count').textContent=lang==='zh'?'显示 '+matches.length+' / '+data.routes.length+' 条路线':matches.length+' / '+data.routes.length+' routes';if(!matches.length){el('cards').textContent=t.empty;return;}for(const r of matches){const a=document.createElement('article'),h=document.createElement('h2');h.textContent=r.title[lang];a.append(h);for(const k of ['problem','when','start'])paragraph(a,t.labels[k],r[k][lang]);const d=document.createElement('details'),s=document.createElement('summary');s.textContent=t.detail;d.append(s);for(const k of ['avoid','prerequisites','exercise','acceptance'])paragraph(d,t.labels[k],r[k][lang]);const links=document.createElement('p');links.className='links';for(const x of r.resources){const link=document.createElement('a');link.textContent=x.title;link.href=x.url;link.rel='noopener noreferrer';links.append(link);}d.append(links);a.append(d);el('cards').append(a);}}
function setLanguage(next){const current=el('route').value;lang=next;document.documentElement.lang=lang==='zh'?'zh-CN':'en';const t=copy[lang];for(const k of ['heading','intro','boundary','guide','learning','delivery','start','searchLabel','routeLabel','review'])el(k).textContent=t[k];el('guide').href='https://github.com/CodyQin/ai-task-compass/blob/main/docs/technical-routes.'+(lang==='zh'?'zh-CN':'en')+'.md';el('learning').href='https://github.com/CodyQin/ai-task-compass/blob/main/docs/learning-paths.'+(lang==='zh'?'zh-CN':'en')+'.md';el('delivery').href='https://github.com/CodyQin/ai-task-compass/blob/main/templates/DELIVERY-CHECKLIST.md';el('start').href=lang==='zh'?'index.html':'en.html';el('route').replaceChildren();for(const [value,label] of [['',t.all],...data.routes.map(r=>[r.id,r.title[lang]])]){const o=document.createElement('option');o.value=value;o.textContent=label;el('route').append(o);}el('route').value=current;el('zh').setAttribute('aria-pressed',String(lang==='zh'));el('en').setAttribute('aria-pressed',String(lang==='en'));render();}
el('zh').onclick=()=>setLanguage('zh');el('en').onclick=()=>setLanguage('en');el('query').oninput=render;el('route').onchange=render;setLanguage('zh');
</script></body></html>
